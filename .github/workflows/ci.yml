# CI for EQ Ape. NOTE: the UI suite step (added 2026-11-12) has never run in CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # macos-26 = arm64 (EQ Ape ships arm64 only). Its image carries Xcode 26.6 as default (checked 2026-11-12).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      # Tests that need a real config file skip themselves because EQAPE_REAL_CONFIG is unset (expected).
      - name: Test EQCore
        run: swift test --package-path EQCore

      - name: Test App
        run: swift test --package-path App

      # Builds the release bundle (arm64, ad-hoc signed). Does not launch the app.
      - name: Build app bundle
        run: |
          ./App/bundle.sh
          test -d "App/build/EQ Ape.app"
          lipo -archs "App/build/EQ Ape.app/Contents/MacOS/EQApe"

      # Scripted GUI suite through the app's in-app test channel (docs/UI-TESTING.md): --no-engine, no OS permissions,
      # events stay inside the app. THIS STEP HAS NEVER RUN IN CI. It needs a logged-in GUI session (window server);
      # GitHub's hosted macOS runners normally provide one (UI tests run there), but that is not guaranteed, so the step
      # is non-blocking until it has passed in CI a few times. The CI build is ad-hoc signed (bundle.sh never uses a
      # local identity when CI is set). Screenshots are uploaded either way.
      - name: UI suite (in-app channel, --no-engine; non-blocking)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          (cd App && BUILD_DIR=build-dev ./bundle.sh)
          App/scripts/uitest suite --out "$RUNNER_TEMP/uitest-suite"

      - name: Upload UI suite screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uitest-suite-screenshots
          path: ${{ runner.temp }}/uitest-suite
          if-no-files-found: ignore
