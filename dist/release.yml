# DRAFT release workflow (EQ Ape, Apple Silicon / arm64 only, https://github.com/Mukimies/eq-ape). Lives in dist/ on purpose; move to .github/workflows/release.yml
# once the repository layout is final.
#
# Trigger: pushing a tag like v0.1.0 (or v0.1.0-beta.1). Also manually runnable for a dry run
# (workflow_dispatch builds and uploads the DMG as a workflow artifact, no release).
#
# Two modes in ONE workflow, chosen automatically:
#   - signed:   all five secrets below exist  -> Developer ID sign + notarize + staple
#   - unsigned: secrets missing               -> ad-hoc signed app, plain DMG, release notes
#                                               tell users how to open it
#
# Secrets (Settings > Secrets and variables > Actions > New repository secret):
#   MACOS_CERT_P12_BASE64   Developer ID Application certificate + private key exported from
#                           Keychain Access as .p12, then:  base64 -i cert.p12 | pbcopy
#   MACOS_CERT_PASSWORD     the password chosen at .p12 export
#   DEVELOPER_ID            full identity name, e.g. "Developer ID Application: Your Name (ABCDE12345)"
#   NOTARY_API_KEY_P8_BASE64  App Store Connect API key (.p8) base64:  base64 -i AuthKey_XXXX.p8 | pbcopy
#   NOTARY_API_KEY_ID       the key ID (10 chars)
#   NOTARY_API_ISSUER_ID    issuer UUID (App Store Connect > Users and Access > Integrations > Team Keys)
# (An app-specific password + Apple ID + team ID also works with notarytool; the API key is
#  preferred in CI because it is revocable and needs no personal Apple ID in the repo settings.)
# Optional, only if Sparkle is adopted later:
#   SPARKLE_ED_PRIVATE_KEY  output of `generate_keys -x` (see DISTRIBUTION.md)

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    # macos-26 = arm64 (the only architecture EQ Ape ships), Xcode for macOS 26. Verify the label still exists when you finalise.
    # (macos-latest currently maps to it too, but pinning avoids surprises.)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decide signed or unsigned
        id: mode
        env:
          HAVE_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.DEVELOPER_ID != '' && secrets.NOTARY_API_KEY_P8_BASE64 != '' }}
        run: echo "signed=$HAVE_CERT" >> "$GITHUB_OUTPUT"

      # Tests first. Adjust paths to the final layout.
      - name: Test EQCore
        run: swift test --package-path EQCore

      # The bundling script produces App/build/EQ Ape.app (ad-hoc signed by default).
      # Adjust the script name/args once the App package is final.
      - name: Build app bundle
        run: |
          cd App
          ./bundle.sh   # Apple Silicon (arm64) only; version comes from Info.plist, see docs/APP-NOTES.md
          test -d "build/EQ Ape.app"

      # ---- signed mode only ----
      - name: Import signing certificate into a temporary keychain
        if: steps.mode.outputs.signed == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPASS="$(uuidgen)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Store notarytool credentials
        if: steps.mode.outputs.signed == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials ci-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER"

      - name: Make DMG (signed + notarized + stapled)
        if: steps.mode.outputs.signed == 'true'
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_PROFILE: ci-notary
        run: dist/make-dmg.sh "App/build/EQ Ape.app" "${{ steps.ver.outputs.version }}"

      # ---- unsigned mode ----
      - name: Make DMG (unsigned / ad-hoc)
        if: steps.mode.outputs.signed != 'true'
        run: dist/make-dmg.sh "App/build/EQ Ape.app" "${{ steps.ver.outputs.version }}"

      - name: Gatekeeper check (informational)
        run: |
          # In unsigned mode this is EXPECTED to report "rejected".
          spctl --assess --type open --context context:primary-signature -vv dist/out/*.dmg || true
          codesign -dv --verbose=2 "App/build/EQ Ape.app" || true

      - name: Clean up keychain
        if: always() && steps.mode.outputs.signed == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: EQ-Ape-${{ steps.ver.outputs.version }}
          path: dist/out/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          PRE=""; [[ "$V" == *-* ]] && PRE="--prerelease"
          if [ "$SIGNED" = "true" ]; then
            NOTE="Signed with Developer ID and notarized by Apple. Open the DMG, drag EQ Ape to Applications."
          else
            NOTE="**This build is not notarized.** macOS will refuse to open it at first. See 'Installing an unsigned build' in the README. Verify the download with the .sha256 file."
          fi
          gh release create "$GITHUB_REF_NAME" dist/out/* \
            --title "EQ Ape $V" --notes "$NOTE" --generate-notes $PRE
